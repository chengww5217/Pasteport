name: Release

# Tag-driven: `git tag v0.1.0 && git push --tags`. The tag is the only trigger, so
# a release is always a deliberate act and always corresponds to a commit on main.
on:
  push:
    tags: ['v*']

# Publishing to the Marketplace is deliberately not automated: it is irreversible
# (a version number can never be reused) and needs a VSCE_PAT secret. This job
# builds the vsix, proves it passes the same checks as CI, and attaches it to the
# GitHub release — `npx @vscode/vsce publish` from that artifact stays manual.
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the release and upload the vsix
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run build
      - run: npm run lint
      - run: npm run format
      - run: npm test

      # A tag that disagrees with package.json would produce a vsix whose filename
      # and contents contradict the release it is attached to. Cheaper to fail here.
      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$manifest" ]; then
            echo "tag v$tag does not match package.json version $manifest" >&2
            exit 1
          fi

      - run: npm run package

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.vsix
          generate_release_notes: true
